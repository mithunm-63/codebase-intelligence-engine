services:
  - type: web
    name: codebase-intelligence-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      - key: MAX_REPOSITORY_SIZE_MB
        value: "50"
      - key: MAX_JAVA_FILES
        value: "2000"
      - key: MAX_ANALYSIS_SECONDS
        value: "120"
      - key: MAX_UPLOAD_REQUEST_SIZE_MB
        value: "60"
      - key: MAX_FILES
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
