services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dependency_sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [dependency-sentinel-pg:/var/lib/postgresql/data]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dependency_sentinel
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8081:8081"]
    depends_on: [postgres]

volumes:
  dependency-sentinel-pg:
